<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings — Paperless Cleaner</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <h1>Paperless Cleaner</h1>
      <nav style="display:flex;align-items:center;gap:1rem;">
        <a href="/">Review metadata</a>
        <a href="/duplicates">Duplicates</a>
        <a href="/settings" style="color:var(--text)">Settings</a>
      </nav>
    </header>
    <main>
      <form id="settingsForm">

        <fieldset>
          <legend>Paperless-NGX connection</legend>
          <label>Base URL
            <input name="paperless_base_url" required />
          </label>
          <label>API Token
            <input name="paperless_token" type="password" autocomplete="off" />
            <small>Shown as *** when a token is configured. Create one in Paperless under My Profile → API Auth Token.</small>
          </label>
          <div class="test-row">
            <button type="button" id="testPaperlessBtn" class="btn-secondary">Test Paperless connection</button>
            <span id="testPaperlessResult" class="test-result" role="status"></span>
          </div>
        </fieldset>

        <fieldset>
          <legend>Suggestion provider</legend>
          <label>Provider
            <select name="suggestion_provider">
              <option value="ollama">Ollama (LLM)</option>
              <option value="heuristic">Heuristic (offline)</option>
            </select>
          </label>
          <div id="ollamaFields" style="display:grid;gap:0.65rem">
          <label>Ollama Base URL
            <input name="ollama_base_url" />
          </label>
          <label>Ollama Model
            <input name="ollama_model" />
          </label>
          <label>Temperature
            <input name="ollama_temperature" type="number" step="0.05" min="0" max="1" />
            <small>0.0 = deterministic. Raise slightly if model produces repetitive output.</small>
          </label>
          <label>Confidence discount
            <input name="confidence_discount" type="number" step="0.05" min="0" max="1" />
            <small>Subtracted from all LLM confidence scores. 0.2 compensates for local model overconfidence.</small>
          </label>
          <label>Few-shot minimum documents
            <input name="few_shot_min_documents" type="number" min="0" step="1" />
            <small>Minimum reviewed documents before library examples replace built-in examples in the prompt.</small>
          </label>
          <div class="test-row">
            <button type="button" id="testOllamaBtn" class="btn-secondary">Test Ollama connection</button>
            <span id="testOllamaResult" class="test-result" role="status"></span>
          </div>
          </div>
        </fieldset>

        <div class="toolbar">
          <button type="submit">Save settings</button>
          <span id="status" class="form-status" role="status"></span>
        </div>
      </form>
    </main>
    <script src="/static/settings.js"></script>
  </body>
</html>
